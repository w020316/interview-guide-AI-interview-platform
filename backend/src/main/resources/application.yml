spring:
  application:
    name: interview-guide

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/interview}
    # Supabase Session pooler 用户名格式为 postgres.<project-ref>，需通过环境变量注入
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      ssl:
        enabled: ${REDIS_SSL:false}

  ai:
    openai:
      api-key: ${AI_API_KEY:sk-placeholder}
      # 注意：Agnes AI base URL 不带 /v1 后缀
      base-url: ${AI_BASE_URL:https://apihub.agnes-ai.com}
      chat:
        options:
          model: ${AI_CHAT_MODEL:agnes-2.5-flash}
          temperature: 0.7
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        # 维度必须与 embedding 模型输出一致：text-embedding-3-small=1536，
        # 切换提供方时同步设置 AI_EMBEDDING_DIMENSIONS（如硅基流动 bge-m3=1024）
        dimensions: ${AI_EMBEDDING_DIMENSIONS:1536}

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: interview-guide

app:
  # 聊天模型降级链（Embedding 另走 app.ai.embedding / spring.ai.openai.*）
  #   1. Agnes AI agnes-2.5-flash   主力，质量与稳定性双料第一（见下方 2026-09-20 横向评测）
  #   2. 智谱 glm-4.7-flash         跨厂商兜底，200K 上下文
  #   3. 智谱 glm-4-flash           末位保险，实测最稳（并发 3/3 通过）
  # api-key 为空的提供方自动跳过；任一节点返回空正文也会被判不可用并继续降级。
  #
  # ⚠️ 2026-09-26（第三轮 P1-02）修正两处长期误导：
  #   a) 本注释此前写「主模型 B.AI GLM-5.3-Flash」（v1.22.0 遗留），而实际链路第一顺位是 Agnes，
  #      与同文件下方的选型说明自相矛盾 —— 已按实际链路重写。
  #   b) 智谱节点必须显式关闭思考模式（thinking-disabled），否则 content 为空、
  #      兜底节点每次被静默跳过（详见 DisableThinkingInterceptor 的类注释）。
  ai:
    # AI 并发闸门排队超时（秒），v1.34.1 P3-8 新增可配置项。
    # 前台许可 5 个、后台许可 2 个（后台=知识自动补充/岗位批量分类等无人在等的任务）。
    # 排队超过该时长即快速失败：前台返回 503「AI 并发闸门排队超时」，后台本次跳过。
    # 取值须 < 上游读超时（application.yml 的 app.ai.read-timeout-seconds=240），否则许可可能长期被占。
    guard-acquire-timeout-seconds: ${AI_GUARD_ACQUIRE_TIMEOUT_SECONDS:30}
    # ── 按厂商 RPM 令牌桶（v1.48.0，第六轮 P1）──────────────────────────
    # 与上面的并发闸门**叠加**：并发闸门限「同时进行数」，本项限「每分钟请求数」。
    # 背景：实测 Agnes 免费档 20 RPM，5 并发 × ~2s 可冲到 ~150 RPM；30 并发突发
    #       时 14/30 成功、16 次 HTTP 429（响应体为空，无法从 body 判断原因）。
    # 阈值在各 chain 节点的 rpm 字段上配置（对厂商官方额度留余量）；同一 base-url
    # 的多个节点共用同一个桶（账户级配额共享）。触顶即降级到下一节点，不阻塞等待。
    # 账户级限流（智谱 1302 / HTTP 429）会退避（约 1s、2s）+ 抖动后重试本节点，
    # 最多 max-retries 次；平台全局过载（智谱 1305）立即换下一节点。
    rate-limit:
      enabled: ${AI_RATE_LIMIT_ENABLED:true}
      max-retries: ${AI_RATE_LIMIT_MAX_RETRIES:2}
    # P2-06 后续（2026-09-19）：embedding 提供方可插拔——Agnes 已下线全部 embedding 模型，
    # 配置 AI_EMBEDDING_BASE_URL + AI_EMBEDDING_API_KEY + AI_EMBEDDING_MODEL 即指向第三方
    # （如硅基流动 https://api.siliconflow.cn/v1 + BAAI/bge-m3 + AI_EMBEDDING_DIMENSIONS=1024），
    # 未配置时回退 spring.ai.openai.*（Agnes）
    embedding:
      base-url: ${AI_EMBEDDING_BASE_URL:}
      api-key: ${AI_EMBEDDING_API_KEY:}
    # ── 简历图片识别（截图 → 文本，v1.45.0）──────────────────────────────
    # 手机上没有可靠的「从别的 App 取简历文件」方案（微信内置浏览器拦 scheme、
    # filehelper 网页版只在电脑可用、wx.chooseMessageFile 需公众号 JS-SDK），
    # 而**截图在任何 App 里都做得到**。这条链路让「截图 → 识别 → 分析」成为通用出路。
    #
    # 模型选型（2026-10-01 实测）：智谱 glm-4v-flash 免费、复用 AI_ZHIPU_API_KEY、
    # 单张 420×900 简历截图 4.14s、12/12 关键字段命中。
    # ⚠️ 该模型 max_tokens 上限是 1024（传 2048 直接 400），**长简历会被截断**，
    #    代码会把 finish_reason=length 如实透出（前端提示用户分两张截图）。
    # 换模型时注意：glm-4.1v-thinking-flash 可用且上限更高，但慢（8~12s）且输出含思考内容。
    vision:
      enabled: ${AI_VISION_ENABLED:true}
      base-url: ${AI_VISION_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
      api-key: ${AI_ZHIPU_API_KEY:}
      model: ${AI_VISION_MODEL:glm-4v-flash}
    chain:
      # ══════════════════════════════════════════════════════════════════
      # 降级链（按顺序尝试，命中即返回）
      #
      # 2026-09-20 选型原则修正：**免费模型中选质量最好的，而非最快的**。
      # 依据：3 平台 × 多模型 × 2 个真实任务（岗位分析 / 简历评估）× 3 次取中位数
      #       的横向评测（脚本 D:\xm\model_verdict.py，结果 model_verdict.json）。
      #
      # ── 评测结果（质量总分 = 岗位分析分 + 简历评估分）─────────────────
      #   模型                 总分   岗位分析      简历评估      稳定性   结论
      #   agnes-2.5-flash      168   q96 /  5.6s  q72 /  9.3s   6/6     ★ 主力
      #   glm-4.5-flash        161   q99 / 13.1s  q62 / 49.2s   6/6     ★ 兜底
      #   agnes-3.0-flash      158   q96 /  4.3s  q62 /  7.6s   6/6
      #   glm-4-flash-250414   155   q96 / 14.2s  q59 / 14.2s   6/6
      #   glm-4-flash          154   q96 / 17.5s  q58 / 18.6s   6/6     ○ 末位保险
      #   agnes-2.0-flash      101   q101/  5.3s  ✗ 失败        1/6     ✗ 免费档已限流
      #
      # ── 关键结论 ────────────────────────────────────────────────────
      # 1. agnes-2.5-flash 质量与稳定性双料第一（简历评估 q72，比智谱最好的
      #    q62 高 16%），且响应快 → 定为**主力**。
      # 2. glm-4.5-flash 岗位分析质量最高（q99）但简历评估慢（49.2s）、
      #    官方标注即将下线 → 作**跨厂商兜底**，不做主力。
      # 3. agnes-2.0-flash 虽最快且岗位分析 q101，但触发
      #    "You've reached the API rate limit for free users" → **必须剔除**，
      #    放进链里只会让每次调用白撞一次墙。
      # 4. 硅基流动全部模型（含 embedding）当前 402 余额不足 → 不可用，未入链。
      # 4. 硅基流动全部模型（含 embedding）当前 402 余额不足 → 不可用，未入链。
      # 5. glm-4.7-flash（200K 上下文最强）—— **2026-09-26 修正**：此前因
      #    「429 访问量过大 + 需 thinking:disabled 才不返回空内容」被排除在链外；
      #    现已在链内**并显式关闭思考模式**（thinking-disabled: true，实测 4.25s/空内容
      #    → 1.38s/正常内容）。注意它并发能力仍弱（并发 3 只有 1 个成功、其余 429/1305），
      #    因此放在兜底位置而非主力，且后面保留 glm-4-flash 作为可靠末端。
      #
      # ── 链路设计（质量递减，跨厂商容灾）──────────────────────────────
      #   1) Agnes agnes-2.5-flash   质量最优，日常主力
      #   2) NVIDIA gpt-oss-20b      跨厂商兜底（40 RPM、并发 3/3）
      #   3) 智谱 glm-4.7-flash      次兜底，200K 上下文（已关思考）
      #   4) 智谱 glm-4-flash        末位保险，实测并发 3/3 通过、1.76s
      #
      # ⚠️ 2026-10-03（第六轮 P1-05）顺位校正：NVIDIA 提到 glm-4.7-flash **之前**。
      #   实测：NVIDIA openai/gpt-oss-20b 40 RPM、并发 3/3；智谱 glm-4.7-flash
      #   并发 0/3（全部 1305 平台过载）+ 单发曾 71.12s 长尾。
      #   主模型故障时 glm-4.7 大概率**再失败一次并拖慢降级**，故只适合更后位。
      #   仅调顺序，未改动任何密钥/URL/模型名与 thinking-disabled 配置。
      #
      # api-key 为空的节点自动跳过；任一节点返回空正文也会被判不可用并继续降级。
      # ══════════════════════════════════════════════════════════════════
      - name: agnes-primary
        base-url: ${AI_BASE_URL:https://apihub.agnes-ai.com}
        api-key: ${AI_API_KEY:}
        model: ${AI_CHAT_MODEL:agnes-2.5-flash}
        temperature: ${AI_TEMPERATURE:0.7}
        # v1.48.0：Agnes 免费档实测 20 RPM，留余量设 15（第六轮 P1）
        rpm: ${AI_AGNES_RPM:15}
      # ── NVIDIA build.nvidia.com（v1.46.0，第三家厂商）────────────────────
      # 2026-10-01 实测（该 Key 下 81 个模型可选）：主力候选里只有 gpt-oss-20b 稳定可用，
      # 其余要么超时要么极慢（glm-5.3-flash 85s、kimi-k3 180s、gemma-4-31b 超时、
      # kimi-k2.6 404 无权限）。
      # 为什么放这里：**并发 3/3 成功**（对照智谱 glm-4.7-flash 并发 0/3、全 1305 平台过载），
      # 社区实测 RPM ≈40（对照 Agnes 免费档 10）→ 作为跨厂商兜底比智谱那档更可靠。
      # 代价是慢（≈5.9s，比 Agnes 的 1.4s 慢 4 倍），所以排在主力之后。
      # ⚠️ gpt-oss-20b 是**推理模型**：显式设小 max_tokens 会返回空正文（本链路不设 max_tokens，
      #    走模型默认值，因此安全）；也**不要**给它加 thinking-disabled——该字段是智谱专有的。
      # ⚠️ api-key 需在部署侧注入（AI_NVIDIA_API_KEY）；为空时本节点自动跳过，不影响链路。
      - name: nvidia-fallback
        base-url: ${AI_NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
        api-key: ${AI_NVIDIA_API_KEY:}
        model: ${AI_NVIDIA_MODEL:openai/gpt-oss-20b}
        temperature: ${AI_TEMPERATURE:0.7}
        # v1.48.0：NVIDIA 实测约 40 RPM，留余量设 30（第六轮 P1）
        rpm: ${AI_NVIDIA_RPM:30}
      - name: zhipu-quality
        base-url: ${AI_ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
        api-key: ${AI_ZHIPU_API_KEY:}
        model: ${AI_ZHIPU_CHAT_MODEL:glm-4.7-flash}
        temperature: ${AI_TEMPERATURE:0.7}
        # 智谱限流以并发为核心，默认不设 RPM 上限（0 = 不限）；如需可经 AI_ZHIPU_RPM 开启。
        # 两个智谱节点同 base-url，共用一个桶。
        rpm: ${AI_ZHIPU_RPM:0}
        # 智谱默认开思考模式 → content 为空 → 兜底节点被静默跳过（P1-02）
        thinking-disabled: true
      - name: zhipu-lastresort
        base-url: ${AI_ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
        api-key: ${AI_ZHIPU_API_KEY:}
        model: ${AI_ZHIPU_FALLBACK_MODEL:glm-4-flash}
        temperature: ${AI_TEMPERATURE:0.7}
        rpm: ${AI_ZHIPU_RPM:0}
        thinking-disabled: true
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # 管理员账号名单（逗号分隔，区分大小写）：命中者签发 ROLE_ADMIN，无限制刷新/保留后续管理接口
  # 注意：默认内置"小吴同学"（历史部署兼容）；注册接口会拒绝保留名，防止抢注名单用户名获得管理员权限。
  # 新部署建议通过环境变量 APP_ADMIN_USERNAMES 显式注入，并确保该账号先于他人注册存在。
  admin-usernames: ${APP_ADMIN_USERNAMES:小吴同学}
  # 种子管理员：启动时若该用户名不存在则自动创建（密码明文仅用于初始化，创建后建议尽快修改）
  # 密码留空则不创建；生产由 SEED_ADMIN_USERNAME / SEED_ADMIN_PASSWORD 注入
  seed-admin:
    username: ${SEED_ADMIN_USERNAME:}
    password: ${SEED_ADMIN_PASSWORD:}
  info:
    # 应用元数据，暴露到 /actuator/info 端点
    # 版本号与前端 changelog.ts 保持同步，修改时两处一起更新
    # ⚠️ v1.39.0：/api/info 此前把 version 写死成 "1.0.0"，没读这里的值，
    #    导致「与前端同步」这个约定在公开接口上一直没生效（两个端点报两个版本号）。
    #    现已改为读本配置；改版本时除了这里与 changelog.ts，无需再动代码。
    name: ${APP_INFO_NAME:interview-guide}
    version: ${APP_INFO_VERSION:1.66.1}
    description: ${APP_INFO_DESCRIPTION:AI 智能面试辅助平台后端}
    # 构建日期，CI 注入；未配置时 fallback 为当天
    build-date: ${APP_INFO_BUILD_DATE:}
  sse:
    # SSE 流式回答最大并发数，超出返回 503
    # Render 免费层建议 20，付费层可调高
    max-concurrent: ${SSE_MAX_CONCURRENT:20}
  job-agent:
    # v1.22.0 招聘信息智能体
    # 内置精选数据源始终启用；第三方平台（智联招聘/前程无忧/BOSS直聘）对接
    # 需配置对应数据服务的 endpoint（聚合类招聘数据 API），为空则跳过该平台
    platforms:
      zhaopin:
        endpoint: ${JOB_ZHAOPIN_ENDPOINT:}
        api-key: ${JOB_ZHAOPIN_API_KEY:}
      job51:
        endpoint: ${JOB_51JOB_ENDPOINT:}
        api-key: ${JOB_51JOB_API_KEY:}
      boss:
        endpoint: ${JOB_BOSS_ENDPOINT:}
        api-key: ${JOB_BOSS_API_KEY:}
    # v1.26.0 通用招聘数据渠道（可任意扩展，name 即展示名与入库 platform 标识）
    # 环境变量等价写法（索引从 0 开始）：
    #   APP_JOB_AGENT_CHANNELS_0_NAME / _ENDPOINT / _API_KEY
    channels: []
    # 定时刷新：每 1 小时拉取一次各平台岗位（v1.27.0 由 6h 收紧，满足“每小时实时更新”）
    refresh-fixed-delay-ms: ${JOB_REFRESH_DELAY:3600000}
  rag:
    # 知识库导入去重相似度阈值（0.0~1.0），相似度 >= 此值视为重复，跳过导入
    # 0.90 对应 cosine distance <= 0.10，覆盖文本微调后重复的场景
    # 调低可更严格去重（如 0.85），调高可放宽（如 0.95）
    dedup-similarity-threshold: ${RAG_DEDUP_THRESHOLD:0.90}
    # 启动时播种系统预置共享知识（shared=true，全部用户可检索）
    # 关闭场景：本地联调不想消耗 embedding 调用、单元测试、或运维想手动维护知识库
    seed-enabled: ${RAG_SEED_ENABLED:true}
  cors:
    # 允许的前端来源（逗号分隔）。支持通配（Spring 的 allowedOriginPatterns）。
    # 修改部署域名时改环境变量 CORS_ALLOWED_ORIGINS 即可，无需改代码。
    #
    # v1.34.1 清理：移除已失效的 interview-guide-ai-interview-platform.vercel.app。
    # 前端实际托管在 Cloudflare Pages（pages.dev），vercel 域名实测已不可达（curl 返回 000）。
    #
    # v1.47.0：精确域名 → https://*.pages.dev 通配。
    #   原因：Cloudflare Pages **不支持重命名项目**，换短域名只能新建项目（得到新的
    #   <name>.pages.dev）。白名单若写死精确域名，每次换域名都要改后端配置并重新部署，
    #   而**漏改会让新前端全站 403**（2026-10-03 实测：Origin: https://offergo.pages.dev → HTTP 403）。
    #   安全性说明：本 API 鉴权走 Bearer token（不是 Cookie），token 存放在各自 origin 的
    #   localStorage 中，第三方 pages.dev 站点无法读取；且无有效 token 一律 401。
    #   故通配 pages.dev 不引入越权面，只消除"换域名即全站不可用"的运维陷阱。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://*.pages.dev,http://localhost:5173,http://127.0.0.1:5173}
  supabase:
    url: ${SUPABASE_URL:https://your-project.supabase.co}
    service-key: ${SUPABASE_SERVICE_KEY:your-service-key}
    bucket: ${SUPABASE_BUCKET:resumes}

logging:
  level:
    com.example.interview: INFO
    org.springframework.ai: WARN
    org.hibernate.SQL: WARN
