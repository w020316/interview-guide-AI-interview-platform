# 生产环境配置（云端部署用）
server:
  port: ${PORT:8080}

spring:
  application:
    name: interview-guide
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: false

  # Supabase PostgreSQL（用户名/密码直接写在 DATABASE_URL 里，避免环境变量未注入问题）
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate

  # Redis（Upstash，TLS 连接）
  data:
    redis:
      url: ${REDIS_URL}
      timeout: 5000
      ssl:
        enabled: true

  # Spring AI（Agnes AI，兼容 OpenAI 协议）
  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL:https://apihub.agnes-ai.com}
      chat:
        options:
          model: ${AI_MODEL:agnes-2.0-flash}
          temperature: 0.3
  # 排除 pgvector 自动装配（512MB 容器内 Metaspace 不足）
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  # 忽略 Redis 健康指示器：
  # Upstash 免费 Redis 可能停用/失效，若纳入健康检查会让 /actuator/health 持续返回 DOWN，
  # 导致 Render 健康检查失败并不断重启实例（表现为永远冷启动）。
  # Redis 仅用于 AI 响应缓存，服务层已做降级，登录/鉴权不依赖 Redis，故排除以保障实例稳定。
  health:
    redis:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  supabase:
    url: ${SUPABASE_URL}
    service-key: ${SUPABASE_SERVICE_KEY}
    bucket: resumes

logging:
  level:
    com.example.interview: WARN
    org.springframework: WARN
