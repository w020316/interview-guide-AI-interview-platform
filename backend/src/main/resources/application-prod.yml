# 生产环境配置（云端部署用）
server:
  port: ${PORT:8080}
  shutdown: graceful            # v1.32.0：优雅停机，部署/重启时等待在途请求完成，减少 5xx
  tomcat:
    # 免费层 512MB 内存下的线程模型：请求线程不宜过多，避免线程栈挤占堆内存
    threads:
      max: 50
      min-spare: 4
    accept-count: 100
    max-connections: 200

spring:
  application:
    name: interview-guide
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: false
  lifecycle:
    # 优雅停机最长等待 20s，超时强制退出（配合 Render 部署窗口）
    timeout-per-shutdown-phase: 20s

  # Supabase PostgreSQL（用户名/密码直接写在 DATABASE_URL 里，避免环境变量未注入问题）
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # v1.32.0：连接有效性检测 + 泄漏预警（供运维在日志中发现 SQL 长期占用）
      validation-timeout: 5000
      connection-test-query: SELECT 1
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      # 生产表通过 schema.sql + SchemaInitializer（启动时幂等建表）维护，
      # 不使用 validate，避免新增实体/表在部署时因尚未手动建表而启动失败。
      ddl-auto: none

  # Redis（Upstash，TLS 连接）
  # P0-02（2026-09-19）：补默认值——REDIS_URL 未注入时占位符无法解析会让整个上下文启动失败；
  # Redis 仅承担 AI 响应缓存，RedisConfig 已做容错回退，不该成为启动的硬依赖。
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 5000
      ssl:
        enabled: true

  # Spring AI（Agnes AI，兼容 OpenAI 协议）
  # P0-02（2026-09-19）：api-key 补默认值。AI 提供方未配置时应只降级 AI 功能，
  # 而不是因占位符解析失败导致应用（含登录/鉴权）完全无法启动。
  ai:
    openai:
      api-key: ${AI_API_KEY:sk-placeholder}
      base-url: ${AI_BASE_URL:https://apihub.agnes-ai.com}
      chat:
        options:
          model: ${AI_MODEL:agnes-2.5-flash}
          temperature: 0.3
  # 排除自动装配以避免启动崩溃：
  # - Redis：其自动装配会按 REDIS_URL 急切解析主机，若 Upstash 端点失效则抛 UnknownHostException，
  #   导致整个上下文无法启动（永远冷启动）。Redis 仅用于 AI 响应缓存，改由 RedisConfig 显式
  #   提供回退本机地址的容错工厂，服务层已做降级，登录/鉴权不依赖 Redis。
  # P2-17（2026-09-19）：恢复 pgvector——Supabase 已启用 vector 扩展（0.8.2），
  # 移除 exclude 后 PgVectorStore 自动装配生效（1536 维/HNSW/COSINE，建表见 application.yml
  # spring.ai.vectorstore.pgvector.*），知识库向量重启不再丢失；原 @Primary 内存
  # ProdVectorStoreConfig 已删除。若 512MB 容器出现 Metaspace 压力，回滚方式：
  # 重新加回本 exclude 并恢复 ProdVectorStoreConfig。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  # 忽略 Redis 健康指示器：
  # Upstash 免费 Redis 可能停用/失效，若纳入健康检查会让 /actuator/health 持续返回 DOWN，
  # 导致 Render 健康检查失败并不断重启实例（表现为永远冷启动）。
  # Redis 仅用于 AI 响应缓存，服务层已做降级，登录/鉴权不依赖 Redis，故排除以保障实例稳定。
  health:
    redis:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  # P0-02（2026-09-19）：Supabase Storage 仅用于简历附件存取，属可选能力。
  # 补默认值避免其环境变量缺失时占位符解析失败、拖垮整个应用启动。
  # 使用默认占位值时上传会失败，服务启动时会打印 WARN 提示运维补齐。
  supabase:
    url: ${SUPABASE_URL:https://placeholder.supabase.co}
    service-key: ${SUPABASE_SERVICE_KEY:placeholder-service-key}
    bucket: resumes

# P2-01：生产禁用 Swagger/OpenAPI，避免接口结构被侦察
# （SecurityConfig 对 swagger 路径的放行保留，但端点关闭后返回 404）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.example.interview: WARN
    org.springframework: WARN
