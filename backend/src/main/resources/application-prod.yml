# 生产环境配置（云端部署用）
server:
  port: ${PORT:8080}

spring:
  application:
    name: interview-guide
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: false

  # Supabase PostgreSQL（用户名/密码直接写在 DATABASE_URL 里，避免环境变量未注入问题）
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      # 生产表通过 schema.sql + SchemaInitializer（启动时幂等建表）维护，
      # 不使用 validate，避免新增实体/表在部署时因尚未手动建表而启动失败。
      ddl-auto: none

  # Redis（Upstash，TLS 连接）
  data:
    redis:
      url: ${REDIS_URL}
      timeout: 5000
      ssl:
        enabled: true

  # Spring AI（Agnes AI，兼容 OpenAI 协议）
  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL:https://apihub.agnes-ai.com}
      chat:
        options:
          model: ${AI_MODEL:agnes-2.0-flash}
          temperature: 0.3
  # 排除自动装配以避免启动崩溃：
  # - pgvector：512MB 容器内 Metaspace 不足
  # - Redis：其自动装配会按 REDIS_URL 急切解析主机，若 Upstash 端点失效则抛 UnknownHostException，
  #   导致整个上下文无法启动（永远冷启动）。Redis 仅用于 AI 响应缓存，改由 RedisConfig 显式
  #   提供回退本机地址的容错工厂，服务层已做降级，登录/鉴权不依赖 Redis。
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  # 忽略 Redis 健康指示器：
  # Upstash 免费 Redis 可能停用/失效，若纳入健康检查会让 /actuator/health 持续返回 DOWN，
  # 导致 Render 健康检查失败并不断重启实例（表现为永远冷启动）。
  # Redis 仅用于 AI 响应缓存，服务层已做降级，登录/鉴权不依赖 Redis，故排除以保障实例稳定。
  health:
    redis:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  supabase:
    url: ${SUPABASE_URL}
    service-key: ${SUPABASE_SERVICE_KEY}
    bucket: resumes

logging:
  level:
    com.example.interview: WARN
    org.springframework: WARN
