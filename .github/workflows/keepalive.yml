name: Keep Render Backend Warm

# Render 免费层 15 分钟无请求会休眠，首次唤醒需 30~50 秒（SUS 评分主要拖累项）
# 通过 GitHub Actions 每 10 分钟 ping 一次 /api/info，避免冷启动
# 频率受 GitHub Actions 最小粒度限制（不能低于 5 分钟），10 分钟是稳定且不浪费免费额度的选择

on:
  schedule:
    # 每 10 分钟执行一次（UTC 时间，与 Asia/Shanghai 无时差影响）
    - cron: '*/10 * * * *'
  workflow_dispatch: # 允许手动触发，便于排查

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping backend health
        env:
          BACKEND_URL: https://interview-guide-backend.onrender.com
        run: |
          set -euo pipefail
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "[$TS] 开始保活 ping → $BACKEND_URL/api/info"
          # --fail: HTTP 非 2xx 退出码非 0
          # --max-time: 总超时 100 秒——Render 冷启动常超 30s（旧值 30s 时
          #   唤醒请求本身被判失败，保活永远报错且无法与冷启动共存）
          # --silent --show-error: 静默成功，仅失败时打印错误
          # 失败自动重试 1 次（首次唤醒 + 二次确认存活）
          ping_once() {
            curl --fail --max-time 100 --silent --show-error "$BACKEND_URL/api/info"
          }
          RESPONSE=$(ping_once || echo "PING_FAILED_1")
          if [[ "$RESPONSE" == PING_FAILED_1* ]]; then
            echo "[$(date -u +"%Y-%m-%dT%H:%M:%SZ")] 首次 ping 失败（可能正在冷启动），10s 后重试"
            sleep 10
            RESPONSE=$(ping_once || echo "PING_FAILED_2")
          fi
          echo "响应: ${RESPONSE:0:200}"
          if [[ "$RESPONSE" == PING_FAILED* ]]; then
            echo "::error::后端 ping 失败，请检查 Render 服务状态"
            exit 1
          fi
          echo "[$(date -u +"%Y-%m-%dT%H:%M:%SZ")] 保活成功"
