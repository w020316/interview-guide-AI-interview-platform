name: Keep Render Backend Warm

# Render 免费层 15 分钟无请求会休眠。通过 GitHub Actions 每 5 分钟 ping 一次
# /api/info 与 /api/health，避免冷启动拖累体验。
#
# ⚠️⚠️ 2026-09-22 实测结论：本工作流**不能作为保活主力**，请勿依赖它 ⚠️⚠️
#
# 用户反馈「连续两次登录都等满 150s 后失败」后排查发现：
#   ① 本文件配的是每 5 分钟一次，但 GitHub 实际调度间隔为 **3~6 小时**
#      （取自 GitHub API 的真实运行时间戳）：
#        2026-09-22T10:05:13Z
#        2026-09-22T05:22:13Z   ← 间隔 4h43m（且该次 Run 失败）
#        2026-09-22T00:42:12Z   ← 间隔 4h40m
#        2026-09-21T18:23:56Z   ← 间隔 3h39m
#        2026-09-21T12:57:00Z   ← 间隔 5h27m
#        2026-09-21T06:19:04Z   ← 间隔 6h38m
#      根因：GitHub Actions 的 schedule 触发器是**尽力而为（best-effort）**调度，
#      在公共仓库上会被大幅降级，几分钟的 cron 实际可能几小时才触发一次。
#      **这不是配置写错，改 cron 表达式无法修复。**
#   ② 后端冷启动实测 **338s / 355s（≈6 分钟）**，最慢超过 8 分钟也出现过
#      （本文件下面那个 480s 的唤醒循环就失败过一次）。
#      → 150s 的前端预算必然失败，这是数学问题，不是网络问题。
#
# → 保活主力改为 Cloudflare Worker + Cron Trigger（准点、1 分钟粒度、免费）：
#     脚本：scripts/keepalive-worker.mjs
#     步骤：docs/keepalive-setup.md
#
# 本工作流**保留作为兜底**（偶尔真能跑起来，聊胜于无），但不要把它当作主要保障。
# 同时请知悉：Render 免费层每月仅 750 instance hours，主后端 7×24 常驻约 730h，
# 且**超额会暂停所有免费服务**，故保活默认只覆盖北京时间 07:00–24:00（详见上述文档）。
#
# ── v1.38.2 修复（2026-09-22）：补上时间窗守卫 ─────────────────────────
# 此前本工作流**没有任何时间窗过滤**，24 小时都在 ping —— 而它对「几点该醒」完全无感。
# 实测最近 23 次定时运行中有 **9 次落在 07:00–24:00 之外**（CST 01/02/03/05/06 点）：
#
#   2026-09-21T22:03:39Z → CST 06 点   ⚠️
#   2026-09-21T18:23:56Z → CST 02 点   ⚠️
#   2026-09-20T21:30:43Z → CST 05 点   ⚠️
#   2026-09-20T19:12:31Z → CST 03 点   ⚠️
#   2026-09-20T16:57:26Z → CST 00 点   ⚠️
#   2026-09-19T21:40:33Z → CST 05 点   ⚠️
#   2026-09-19T19:28:17Z → CST 03 点   ⚠️
#   2026-09-19T17:23:30Z → CST 01 点   ⚠️
#
# 每次窗外运行都会白唤醒一次后端（冷启动数分钟 + 保活 15 分钟 ≈ 0.3~0.4 instance hours），
# 按 ~30% 的越窗比例折算约 15h/月 —— 纯浪费，且直接啃掉留给 embedding 的额度余量。
# 更隐蔽的代价：它会在凌晨随机把后端弄热，**让「窗外应该冷」的验证无法成立**。
#
# 修复：作业第一步判定时间窗，窗外直接跳过（**不发出任何请求**）。
# 守卫**失败方向是「跳过」**：宁可漏一次兜底（主力是 Cloudflare Worker），也不要白吃额度。
#
# ── v1.34.0 调整（2026-09-20）：10 分钟 → 5 分钟 ──────────────────────
# 目的：把「用户遇到冷启动」的概率降到最低。
# Render 休眠阈值是 15 分钟，原 10 分钟间隔理论上够，但 GitHub 定时任务
# 在高峰期**常有数分钟延迟**，叠加后可能越过 15 分钟阈值导致休眠；
# 改为 5 分钟可为延迟留出充足余量。
# （注：事后证明「数分钟延迟」的判断过于乐观，实际延迟是数小时。）
#
# 成本：本仓库为 **public**，GitHub Actions 分钟数不限量，加密间隔零成本。
#      （若将来改为 private 仓库需注意：每 5 分钟一次 ≈ 288 次/天，
#        按每次最少 1 分钟计费会超出 2000 分钟/月的免费额度。）
#
# ⚠️ 已知限制：GitHub 对「60 天无提交活动」的仓库会**自动停用**定时工作流。
#    本项目在持续开发中不受影响；若长期停更，需手动在 Actions 页重新启用。
#
# v1.32.1 修复（2026-09-19）——此前近 100 次运行 97% 失败，根因有二：
# 1. 唤醒预算不足：旧逻辑 2×100s+10s（约 210s）打不穿免费实例的 JVM 冷启动
#    （Spring Boot + Spring AI 全家桶在 512MB 免费档冷启动常超 3 分钟）。
#    改为"耐心唤醒循环"：单次 30s 超时、每 20s 重试、总预算 8 分钟——
#    唤醒成功即保活成功，后续运行走热路径秒级返回。
# 2. 深度体检解析旧格式：P2-08 分级健康检查后，匿名 /api/health 只返回
#    {"status":"UP"}（不再含 database/redis 明细，组件级体检移至需认证的
#    /api/health/detail）。旧脚本解析 data.database.status 必然 PARSE_ERR。
#    现退化为存活 + API 完整性校验；组件级监控如需恢复，应为监控场景
#    单独开通账号并走认证调用（待定，不在本匿名工作流范围）。

on:
  schedule:
    # 每 5 分钟执行一次（UTC 时间，与 Asia/Shanghai 无时差影响）
    # 注：5 分钟是 GitHub Actions cron 的最小粒度，无法再密
    - cron: '*/5 * * * *'
  workflow_dispatch: # 允许手动触发，便于排查

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 时间窗守卫（北京时间 07:00–24:00，窗外不唤醒后端）
        id: window
        run: |
          set -euo pipefail
          # 与 Cloudflare Worker 用同一套策略（scripts/keepalive-worker.mjs）：
          # 免费层 750 instance hours/月，7×24 常驻 ≈730h，**超额会暂停所有免费服务**。
          # CST = UTC+8；07:00 CST = 23:00 UTC，24:00 CST = 16:00 UTC。
          UTC_H=$(date -u +%H)
          if ! [[ "$UTC_H" =~ ^[0-9]{2}$ ]]; then
            # 解析失败 → 按「窗外」处理。这是刻意的失败方向：
            # 少一次兜底保活无所谓（主力是 Worker），白吃额度却会累积成超额。
            echo "::warning::无法解析 UTC 小时（'$UTC_H'），按窗外处理并跳过本次保活"
            echo "in_window=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CST_H=$(( (10#$UTC_H + 8) % 24 ))
          if (( CST_H >= 7 && CST_H < 24 )); then
            echo "in_window=true" >> "$GITHUB_OUTPUT"
            echo "北京时间 ${CST_H} 点 → 窗内，继续保活"
          else
            echo "in_window=false" >> "$GITHUB_OUTPUT"
            echo "北京时间 ${CST_H} 点 → 窗外，跳过本次保活（不向后端发出任何请求）"
          fi

      - name: Wake & ping backend
        if: steps.window.outputs.in_window == 'true'
        env:
          BACKEND_URL: https://interview-guide-backend.onrender.com
        run: |
          set -euo pipefail
          DEADLINE=$((SECONDS + 480))
          ATTEMPT=0
          while true; do
            ATTEMPT=$((ATTEMPT + 1))
            CODE=$(curl -o /dev/null -w '%{http_code}' --max-time 30 \
              --silent --show-error "$BACKEND_URL/api/info" || echo 000)
            echo "[$(date -u +"%Y-%m-%dT%H:%M:%SZ")] 第 $ATTEMPT 次 ping → HTTP $CODE"
            if [[ "$CODE" == 2* ]]; then
              echo "[$(date -u +"%Y-%m-%dT%H:%M:%SZ")] 保活成功（第 $ATTEMPT 次尝试）"
              break
            fi
            if (( SECONDS >= DEADLINE )); then
              echo "::error::唤醒超时：8 分钟内无法唤醒后端，请检查 Render 服务状态"
              exit 1
            fi
            sleep 20
          done

      - name: Liveness & API sanity check
        if: steps.window.outputs.in_window == 'true'
        env:
          BACKEND_URL: https://interview-guide-backend.onrender.com
        run: |
          set -euo pipefail
          BODY=$(curl --fail --max-time 60 --silent --show-error \
            "$BACKEND_URL/api/health" || echo "HEALTH_FAILED")
          if [[ "$BODY" == HEALTH_FAILED ]]; then
            echo "::error::/api/health 不可达"
            exit 1
          fi
          echo "响应: ${BODY:0:200}"
          # P2-08 后匿名端点仅含 data.status=UP；DB/Redis 细节在需认证的 /api/health/detail
          if ! echo "$BODY" | grep -q '"status":"UP"'; then
            echo "::error::健康状态异常，响应：$BODY"
            exit 1
          fi
          echo "[$(date -u +"%Y-%m-%dT%H:%M:%SZ")] 存活与 API 校验通过"
