name: CI

# v1.34.1：actions 升级（checkout@v5 / setup-java@v6 / setup-node@v6 / upload-artifact@v6），
# 消除「Node.js 20 is deprecated」告警。注意各 action 的主版本并不连续（setup-java 没有 v5），
# 版本号以 GitHub releases 为准，不要凭猜测升到不存在的 tag。

# 持续集成：提交/合并前自动运行后端 Maven 测试 + 前端 Vitest 测试与构建
# - 后端：Java 21 + Maven（@WebMvcTest + Mockito 单测，无需真实 DB/Redis）
# - 前端：Node 24 + Vitest run（含覆盖率阈值）+ vite build 验证可产物
# 任一环节失败即阻断，确保主干质量
# 注意：仓库根即 interview-guide，backend/frontend 直接位于根下，无需 interview-guide/ 前缀

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Maven Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven test
        # 测试均为 @WebMvcTest + Mockito，不依赖真实 PostgreSQL/Redis
        # JWT_SECRET 等敏感变量使用占位值，测试不读取真实配置
        env:
          JWT_SECRET: ci-placeholder-secret-for-testing-only-not-for-production
        run: mvn -B -ntp test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7

  frontend-test:
    name: Frontend Vitest + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (v1.32.0)
        # 依赖安全审计：高危/严重漏洞阻断构建（自动修复可由 Dependabot PR 承担）
        run: npm audit --audit-level=high

      - name: Type check (vue-tsc)
        # 类型错误在 CI 阶段即可捕获，避免 vite build（esbuild 去类型）静默放行
        run: npx vue-tsc --noEmit

      - name: Run Vitest (with coverage threshold 80%)
        run: npm run coverage

      - name: Build verification
        # 验证 TypeScript 编译 + Vite 产物可正常生成
        env:
          VITE_API_BASE_URL: https://ci-placeholder.example.com
        run: npm run build

  keepalive-guard:
    # 保活时间窗是「写错就会撑爆 Render 免费层额度、并暂停所有免费服务」的关键配置，
    # 而它有两处实现（Cloudflare Worker 的 JS 与 keepalive.yml 的 bash 守卫）。
    # 这里把「一致性 + 闸门行为 + 额度守卫」做成门禁：任何一处漂移都在 push 时被拦住，
    # 不依赖人记得手动跑脚本。
    name: Keepalive Window Guard (保活时间窗)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: 窗口一致性（Worker JS ↔ Actions YAML）
        run: node scripts/check-window-consistency.mjs

      - name: 时间窗单元测试（判定函数 + 闸门行为 + 额度守卫）
        run: node --test scripts/keepalive-worker.test.mjs

      - name: 线上↔仓库 指纹比对逻辑（离线测试）
        run: node --test scripts/check-deployed-worker.test.mjs