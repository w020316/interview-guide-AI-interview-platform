# Render 部署配置
# 使用方法: Render Dashboard → New → Blueprint → 选择此仓库
services:
  - type: web
    name: interview-guide-backend
    env: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # ── AI 模型降级链（v1.22.0）──
      # 主模型：B.AI GLM-5.3-Flash（免费）；次模型：B.AI Qwen3.8-Flash（免费）；兜底：Agnes AI
      - key: AI_BAI_API_KEY
        sync: false
      - key: AI_BAI_BASE_URL
        value: https://api.b.ai
      - key: AI_BAI_CHAT_MODEL
        value: glm-5.3-flash
      - key: AI_BAI_CHAT_MODEL_SECONDARY
        value: qwen3.8-flash
      # ── Agnes AI（兜底模型 + 知识库 Embedding）──
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://apihub.agnes-ai.com
      - key: AI_CHAT_MODEL
        value: agnes-2.0-flash
      - key: AI_EMBEDDING_MODEL
        value: text-embedding-3-small
      # ── Supabase PostgreSQL（用户名密码直接写进 DATABASE_URL，避免环境变量注入问题）──
      - key: DATABASE_URL
        sync: false  # jdbc:postgresql://aws-0-xxx.pooler.supabase.com:5432/postgres?user=postgres.REF&password=PASSWORD
      # ── Upstash Redis ──
      - key: REDIS_URL
        sync: false
      - key: REDIS_SSL
        value: "true"
      # ── JWT ──
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      # ── Supabase Storage ──
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: resumes
      # ── JVM 内存（适配 Render 免费层 512MB）──
      - key: JAVA_OPTS
        value: "-Xmx220m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0"
