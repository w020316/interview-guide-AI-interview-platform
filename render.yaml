# Render 部署配置（云部署 —— 电脑关机也能用）
#
# 使用方法：Render Dashboard → New → Blueprint → 选择本仓库
#
# ── 2026-09-20 更新说明 ────────────────────────────────────────────────
# 本次修正三处已失效配置：
#   1. AI 降级链：原写 B.AI（glm-5.3-flash）已不可用，改为当前实测链路
#      Agnes agnes-2.5-flash → 智谱 glm-4.5-flash → 智谱 glm-4-flash
#   2. Embedding：原指 Agnes text-embedding-3-small，但 Agnes **无该通道**
#      （503 model_not_found），导致 prod 知识库播种长期失败。改为阿里云百炼。
#   3. 新增 RAG 自动补充知识相关开关（全行业覆盖依赖此机制）。
#
# ⚠️ 本地 ONNX Embedding 服务（D:\xm\embed_server.py）**无法用于云部署** ——
#    它跑在你电脑上，电脑关机即不可用。云端必须用远程 Embedding API。
services:
  - type: web
    name: interview-guide-backend
    env: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    # ── 2026-09-22：改为「只在 backend 目录变更时部署」────────────────────
    # 此前是 autoDeploy: true，导致**任何**推送（哪怕只改了前端或文档）都会
    # 重新构建并重启后端 —— 白白吃掉一次冷启动窗口，还浪费 Render 的构建额度。
    #
    # autoDeployTrigger 是官方推荐字段（取代已废弃的布尔型 autoDeploy，
    # 两者同时出现时以 autoDeployTrigger 为准）：
    #   commit      = 每次提交都部署（等价于旧 autoDeploy: true）
    #   checksPass  = 仅当分支 CI 通过才部署
    #   off         = 关闭自动部署
    autoDeployTrigger: commit
    # buildFilter 使用 glob 语法，路径**相对仓库根目录**。
    # ⚠️ 同步蓝图时该字段会**完全替换**服务上已有的过滤设置；若整个字段被省略，
    #    已有设置会被清空为空列表 —— 所以这里必须显式写全。
    # backend/ 下被跟踪的只有 .dockerignore / Dockerfile / pom.xml / src，
    # 因此 backend/** 既覆盖全部真实源码，又不会被 target/ 等产物噪声触发。
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # ══ 1. AI 对话降级链（app.ai.chain）════════════════════════════
      # 主力：Agnes agnes-2.5-flash —— 质量与稳定性双料第一
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://apihub.agnes-ai.com
      - key: AI_CHAT_MODEL
        value: agnes-2.5-flash
      # 兜底 1：智谱 glm-4.5-flash —— 跨厂商容灾，岗位分析质量最高
      - key: AI_ZHIPU_API_KEY
        sync: false
      - key: AI_ZHIPU_BASE_URL
        value: https://open.bigmodel.cn/api/paas/v4
      # ⚠️ 2026-09-23 校正：glm-4.5-flash 已于 2026-01-30 下线，请求会被智谱侧**静默路由**
      #   到 glm-4.7-flash（不报错，于是配置错误被长期掩盖）。改为显式模型名，
      #   避免「配置里写的」与「实际跑的」不是同一个模型。
      - key: AI_ZHIPU_CHAT_MODEL
        value: glm-4.7-flash
      # 兜底 2：智谱 glm-4-flash —— 末位保险
      - key: AI_ZHIPU_FALLBACK_MODEL
        value: glm-4-flash

      # ══ 2. Embedding（自托管，零成本）══════════════════════════════
      # 2026-09-23 注释校正：原注释描述的是**已弃用**的阿里云百炼方案，与实际配置不符；
      #   其中「维度必须设 1024」这类强约束警告会把后续维护者直接带沟里。
      #
      # 当前实际：本仓库 embedding-service/ 自托管 fastembed(ONNX) + BAAI/bge-small-zh-v1.5
      #   · 维度 **512**（不是 1024），AI_EMBEDDING_DIMENSIONS 必须与之一致
      #   · 与本地开发环境同一模型 → RAG_AUTO_SUPPLEMENT_MAX_DISTANCE=0.45 的标定仍然有效
      #   · 免费、无限额度；代价是该服务同样跑在 Render 免费层，空闲 15 分钟休眠、
      #     冷启动约 24s。**它不在保活窗口内**（成本取舍见 docs/keepalive-setup.md）
      #
      # ⚠️ 换任何 embedding 供应商都适用的通用约束：
      #   1) AI_EMBEDDING_DIMENSIONS **只影响 pgvector 建表** —— AiConfig 构造 embedding 选项时
      #      没有把 dimensions 传给 API，实际返回维度由**模型默认值**决定。填错会得到
      #      「表是 N 列、写入 M 维向量」的维度不匹配错误。
      #   2) 首次切换 embedding 供应商/模型后，需清空 pgvector 旧表（向量空间不通用）：
      #      在 Supabase SQL Editor 执行 DROP TABLE IF EXISTS vector_store; 重启后自动重建。
      #   3) 检索阈值 RAG_AUTO_SUPPLEMENT_MAX_DISTANCE 必须按新模型重新标定。
      - key: AI_EMBEDDING_BASE_URL
        value: https://interview-guide-embedding.onrender.com
      # ⚠️ 2026-09-23 安全修复：此处原为明文 value，随**公开仓库**泄露，
      #   实测外部可直接调用该 embedding 服务（不带令牌 401 / 带泄露令牌 200）。
      #   现改为 sync: false —— 值在 Render 面板维护，务必与 embedding 服务的
      #   EMBED_AUTH_TOKEN **保持一致**（后者同样已改为面板维护）。
      - key: AI_EMBEDDING_API_KEY
        sync: false
      - key: AI_EMBEDDING_MODEL
        value: BAAI/bge-small-zh-v1.5
      - key: AI_EMBEDDING_DIMENSIONS
        value: 512

      # ══ 3. RAG 自动补充知识（全行业覆盖的机制）═════════════════════
      - key: RAG_AUTO_SUPPLEMENT
        value: "true"
      - key: RAG_AUTO_SUPPLEMENT_PER_HOUR
        value: "30"
      # ⚠️⚠️ 此阈值是「检索是否命中」的判定线，**必须按 embedding 模型重新标定**！
      #   0.45 是本地 bge-small-zh-v1.5 的实测分界值（在库命中约 0.32、不在库约 0.52）。
      #   百炼 text-embedding-v4 的余弦距离尺度**不同**，照搬会导致
      #   「该补充的不补充」或「已覆盖的重复补充」。
      #   标定方法：登录后问一个知识库已有的问题 + 一个明显没有的问题，
      #            看后端日志中 `RAG 命中但相似度不足（bestDistance=...）` 的实际数值，
      #            取二者之间的分界值回填此处。
      - key: RAG_AUTO_SUPPLEMENT_MAX_DISTANCE
        value: "0.45"

      # ══ 4. 数据库：Supabase PostgreSQL（已启用 pgvector）══════════════
      # 向量库直接用 pgvector，**知识重启不丢**，无需本地那套文件快照
      # 格式：jdbc:postgresql://aws-0-xxx.pooler.supabase.com:5432/postgres?user=postgres.REF&password=PASSWORD
      - key: DATABASE_URL
        sync: false

      # ══ 5. Redis：Upstash（仅用于 AI 响应缓存，失效不影响核心功能）═══
      - key: REDIS_URL
        sync: false
      - key: REDIS_SSL
        value: "true"

      # ══ 6. 鉴权 ════════════════════════════════════════════════════
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      # 管理员账号名单（逗号分隔）；命中者享有无限制刷新等管理能力
      - key: APP_ADMIN_USERNAMES
        value: "小吴同学"
      # 种子管理员：启动时若账号不存在则自动创建
      - key: SEED_ADMIN_USERNAME
        value: "小吴同学"
      - key: SEED_ADMIN_PASSWORD
        sync: false

      # ══ 7. Supabase Storage（简历附件存储）════════════════════════
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: resumes

      # ══ 7.5 向量表维度迁移开关（默认关闭）══════════════════════════
      # 维度迁移已于 2026-09-21 完成（1024→512，69 条知识重新入库）。
      # 仅当再次更换 embedding 模型且**确认可弃旧数据**时临时改为 true。
      - key: app.rag.dimension-migrate-force
        value: "false"

      # ══ 8. JVM 参数（适配 Render 免费层 512MB / 极低 CPU 配额）═══════
      # Metaspace 必须 ≥128m，否则 Spring Boot + AI + Security 栈类加载失败。
      #
      # 2026-09-22 新增 -XX:TieredStopAtLevel=1：
      #   免费层实例 CPU 被严重限制，冷启动实测 **209~488s（中位约 256s）**，
      #   而热态响应只需 6~8s —— 说明耗时几乎全在「JVM 启动 + Spring 上下文刷新」
      #   这一段纯 CPU 工作上（已确认启动期没有阻塞式外部调用：唯一的
      #   @PostConstruct 外部依赖 UserBanRegistry 读 Redis 在 prod 已被排除自动装配，
      #   会直接短路返回）。
      #   TieredStopAtLevel=1 让 JIT 只用到 C1，并**完全不创建 C2 编译线程** ——
      #   CPU 被限制时，省下的编译线程争抢就是实打实的启动加速。
      #   代价是长时间高负载计算会慢一些；本项目是 DB/AI 网络 IO 型，几乎无影响。
      #
      # 同时移除 -XX:MaxRAMPercentage=50.0：它与 -Xmx220m 同时出现属于**死配置**
      #   （显式 -Xmx 优先，MaxRAMPercentage 只在未设 -Xmx 时用于推算默认堆上限），
      #   留着只会让后人误以为堆上限是 256m。
      #
      # 改完如何验证：等下一次保活工作流被触发（GitHub 限流，约 3~6 小时一次），
      #   用 scripts/coldstart-report.mjs 读它的运行时长，即可看到冷启动的变化趋势。
      - key: JAVA_OPTS
        value: "-Xmx220m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -XX:+UseContainerSupport -XX:TieredStopAtLevel=1"

# ══════════════════════════════════════════════════════════════════
# 自托管 Embedding 服务（免费方案，v1.34.1）
# 第三方 embedding API 全部收费（硅基流动/智谱/百炼均需余额），
# 改用 fastembed(ONNX) + bge-small-zh-v1.5 自托管：零成本、无限额度，
# 且与本地开发环境同一模型，RAG 自动补充阈值 0.45 的标定重新有效。
# 模型在 Docker 构建期烘焙进镜像，运行期离线加载，512MB 内存实测占用约 300MB。
  - type: web
    name: interview-guide-embedding
    env: docker
    plan: free
    dockerfilePath: ./embedding-service/Dockerfile
    dockerContext: ./embedding-service
    healthCheckPath: /health
    # 同主后端：只在 embedding-service 目录变更时部署，避免无关推送触发重建
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - embedding-service/**
    envVars:
      - key: EMBED_MODEL
        value: BAAI/bge-small-zh-v1.5
      - key: EMBED_CACHE
        value: /app/models
      # 轻量防滥用令牌（后端 AI_EMBEDDING_API_KEY 需填同名值）
      # ⚠️ 2026-09-23 安全修复：此处原为明文 value，随公开仓库泄露。改为 sync: false，在面板维护。
      # 服务端支持**逗号分隔多令牌**（见 embedding-service/server.py），可用于零中断轮换：
      #   ① 面板填「新,旧」→ 本服务重启（两者都可用）
      #   ② 面板把后端 AI_EMBEDDING_API_KEY 改为「新」→ 后端重启
      #   ③ 面板把本服务改回「新」→ 完成轮换，旧令牌彻底失效
      # 另：服务端已改为 fail-closed（未配置令牌时拒绝所有请求，而非静默开放），
      #   因此**不要**把本变量删空——删空会导致知识库彻底不可用。
      - key: EMBED_AUTH_TOKEN
        sync: false
